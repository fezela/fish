services:
  postgres:
    image:  postgres:17
    environment:
      POSTGRES_USER: fish
      POSTGRES_PASSWORD: development
      POSTGRES_DB: fishdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

  gateway:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
